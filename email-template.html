<!-- Plantilla de EmailJS usada por Habĭtus -->

<h2>Nuevo registro de Habĭtus</h2>

<p><strong>Nombre:</strong> {{name}}</p>
<p><strong>Edad:</strong> {{age}}</p>
<p><strong>Email:</strong> {{email}}</p>

<h3>Hábitos actuales</h3>
<p>{{current}}</p>

<h3>Dificultades</h3>
<p>{{difficulty}}</p>

<h3>Objetivo</h3>
<p>{{goal}}</p>

<h3>Primer cambio</h3>
<p>{{first_change}}</p>

<h3>Extra</h3>
<p>{{extra}}</p>

<!--
Variables utilizadas:
- name
- age
- email
- current
- difficulty
- goal
- first_change
- extra
-->
